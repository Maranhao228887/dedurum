<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gordoflix - Seu Catálogo de Filmes</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="logo-container">
      <img src="/images/foto.png" alt="Logo do Meu Catálogo" class="logo-img">
      <span class="logo-text">Meu Catálogo</span>
    </div>

    <nav class="nav-links" aria-label="Navegação principal">
      <button id="tabSearchBtn" class="nav-btn active" type="button" onclick="trocarAba('search')" aria-controls="searchSection">
        Buscar filmes
      </button>
      <button id="tabListBtn" class="nav-btn" type="button" onclick="trocarAba('list')" aria-controls="listSection">
        Minha coleção
      </button>
    </nav>
  </header>

  <main class="container">
    <section id="searchSection" class="tab-content active" aria-labelledby="heading-search">
      <header class="section-header">
        <h1 id="heading-search" class="section-title">Pesquisar filmes</h1>
      </header>

      <div class="search-box">
        <input
          id="searchInput"
          type="search"
          placeholder="Digite o nome de um filme..."
          onkeydown="checarEnter(event)"
          aria-label="Buscar filme por título"
          autocomplete="off"
        >
        <button class="btn-primary" type="button" onclick="buscarFilme()">Buscar</button>
      </div>

      <div id="searchResult" class="search-result-container" aria-live="polite"></div>
    </section>

    <section id="listSection" class="tab-content" aria-labelledby="heading-list">
      <header class="section-header">
        <h2 id="heading-list" class="section-title">Minha Coleção</h2>

        <nav class="filter-bar" aria-label="Filtros da Lista">
          <button class="filter-btn active" type="button" onclick="filtrarLista('todos')">Todos</button>
          <button class="filter-btn" type="button" onclick="filtrarLista('Quero Assistir')">Quero Assistir</button>
          <button class="filter-btn" type="button" onclick="filtrarLista('Já Assistido')">Já Assistido</button>
        </nav>
      </header>

      <div id="catalogGrid" class="catalog-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Gordoflix. Todos os direitos reservados.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
